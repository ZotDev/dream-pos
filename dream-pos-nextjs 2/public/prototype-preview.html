;font-weight:600}.status{display:inline-flex;padding:5px 8px;border-radius:30px;font-size:10px;font-weight:700;background:#eaf8ef;color:#178443}.status.warn{background:#fff4df;color:#b76c0b}.status.bad{background:#feecec;color:#c12f2f}.status.info{background:#eaf2ff;color:#2b63bf}.row-actions{display:flex;gap:6px}.linkbtn{background:transparent;color:#bd711f;font-weight:700;font-size:12px;padding:4px}.empty{padding:35px;text-align:center;color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;color:var(--muted);font-size:11px}.pill{padding:5px 8px;border-radius:8px;background:#f5f6f8;font-size:11px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:600;color:#475267}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2e8;border-radius:8px;padding:11px 12px;outline:none;background:white;color:var(--navy)}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #fff1e1}.modal-backdrop{position:fixed;inset:0;background:#18243870;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:19px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}.modal-head h3{margin:0;font-size:17px}.close{background:#f4f5f7;border-radius:8px;width:32px;height:32px;font-size:20px}.modal-body{padding:22px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:white}.toast{position:fixed;right:22px;bottom:22px;background:#203653;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:40;display:none}.toast.show{display:block}.split{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}.pos-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product-tile{border:1px solid var(--border);border-radius:11px;padding:12px;background:#fff;text-align:left}.product-tile:hover{border-color:var(--orange)}.product-img{height:70px;border-radius:8px;background:#fff3e5;display:grid;place-items:center;font-size:28px;margin-bottom:9px}.product-tile strong{display:block;font-size:12px;margin-bottom:5px}.product-tile small{color:var(--muted)}.cart-line{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eef0f3;padding:12px 0}.cart-name{flex:1;min-width:0}.cart-name strong{display:block;font-size:12px}.cart-name small{color:var(--muted)}.qty{display:flex;align-items:center;gap:6px}.qty button{height:25px;width:25px;border-radius:6px;background:#f4f5f7}.totalrow{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted)}.totalrow.grand{font-size:17px;font-weight:800;color:var(--navy);border-top:1px solid var(--border);margin-top:8px;padding-top:14px}.notice{padding:12px 14px;background:#fff6e9;border:1px solid #ffe2bd;border-radius:10px;color:#8c581c;font-size:12px;line-height:1.5}.mobile-overlay{display:none}
@media(max-width:1100px){.sidebar{width:220px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{position:fixed;left:-270px;top:0;bottom:0;z-index:15;width:255px;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-overlay.show{display:block;position:fixed;inset:0;background:#1e293b55;z-index:14}.hamb{display:block}.topbar{height:64px;padding:0 14px}.global-search{width:min(45vw,250px)}.store-select{display:none}.content{padding:20px 14px}.page-head{flex-direction:column}.page-head h1{font-size:22px}.kpis{gap:10px}.kpi{padding:13px}.kpi-value{font-size:21px}.panel{padding:15px}.pos-products{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table-tools{padding:13px}.hide-mobile{display:none}.pagination{gap:10px;flex-wrap:wrap}.top-actions{gap:5px}.avatar{height:32px;width:32px}}

</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">D</div><div><strong>Dreams</strong><small>POS</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-bottom">Dream POS Retail Suite<br><span id="tenantFoot">Demo Retail Store</span><br>Build preview · Local demo data</div>
</aside>
<div class="mobile-overlay" id="overlay" onclick="toggleSidebar(false)"></div>
<main class="main">
<header class="topbar">
 <div class="top-left"><button class="hamb" onclick="toggleSidebar(true)">☰</button><div class="global-search"><input id="globalSearch" placeholder="Search products, invoices, customers…" onkeydown="if(event.key==='Enter')globalSearchGo()"></div></div>
 <div class="top-actions"><select class="store-select" id="storeSelect" onchange="toast('Store context changed to '+this.value)"><option>Main Store · Kolkata</option><option>Salt Lake Branch</option><option>Warehouse 01</option></select><button class="iconbtn" onclick="toast('You are all caught up')">♧</button><button class="iconbtn" onclick="openModal('Quick settings',settingsForm())">⚙</button><div class="avatar" title="Demo administrator">A</div></div>
</header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const groups=[
 ['OVERVIEW',[['Dashboard','▦'],['POS Billing','▣'],['Sales Management','↗'],['Quotations','▤'],['Invoices','▧'],['Returns & Exchanges','↩']]],
 ['CATALOG & STOCK',[['Products','□'],['Categories','▦'],['Barcode Management','▥'],['Inventory Management','▤'],['Stock Management','▧'],['Warehouse Management','⌂']]],
 ['PROCUREMENT',[['Purchase Management','⇩'],['Suppliers','♙']]],
 ['CUSTOMERS',[['Customers','♧'],['Customer Loyalty','☆']]],
 ['FINANCE & PEOPLE',[['Expense Management','＄'],['Accounting & Finance','▤'],['HRM & Payroll','♙']]],
 ['INSIGHTS',[['Reports & Analytics','▥']]],
 ['WORKSPACE',[['Chat Application','☏'],['Email Application','✉'],['Calendar','▦'],['Notes','▤'],['To Do','✓'],['Projects','◫'],['File Manager','▣'],['Audio & Video Calls','◉']]],
 ['ADMINISTRATION',[['SaaS Super Admin','♜'],['User & Role Management','♙'],['Document Center','▧'],['Settings','⚙']]]
];
let current='Dashboard', role='Business Owner', modalSave=null;
let products=[
{id:1,name:'Classic Notebook A5',sku:'NB-A5-001',barcode:'8901000000012',category:'Stationery',price:120,cost:72,stock:86,status:'Active',image:'📒'},
{id:2,name:'Ball Pen Blue',sku:'PEN-BL-010',barcode:'8901000000029',category:'Stationery',price:15,cost:6,stock:240,status:'Active',image:'🖊️'},
{id:3,name:'Desk Organizer',sku:'DSK-ORG-003',barcode:'8901000000036',category:'Office',price:349,cost:210,stock:14,status:'Active',image:'🗃️'},
{id:4,name:'Water Bottle 1L',sku:'WB-1L-014',barcode:'8901000000043',category:'Lifestyle',price:199,cost:110,stock:8,status:'Low Stock',image:'🧴'},
{id:5,name:'Premium Marker Set',sku:'MRK-SET-008',barcode:'8901000000050',category:'Stationery',price:249,cost:150,stock:0,status:'Out of Stock',image:'🖍️'},
{id:6,name:'USB-C Cable',sku:'USB-C-002',barcode:'8901000000067',category:'Electronics',price:299,cost:170,stock:33,status:'Active',image:'🔌'}
];
let customers=[{id:1,name:'Aarav Sen',phone:'+91 98765 43210',email:'aarav@example.com',type:'Retail',points:420,balance:0},{id:2,name:'Mira Das',phone:'+91 98765 12345',email:'mira@example.com',type:'Retail',points:180,balance:1250},{id:3,name:'Eastern Office Supplies',phone:'+91 98300 11122',email:'accounts@eastern.example',type:'Business',points:760,balance:8500}];
let suppliers=[{id:1,name:'Kolkata Stationers Pvt Ltd',phone:'+91 33 4000 1234',email:'sales@kolkatastationers.example',gstin:'19AABCU9603R1ZM',balance:12500},{id:2,name:'Metro Lifestyle Distributors',phone:'+91 98300 22222',email:'orders@metrolife.example',gstin:'19AACCM1234F1ZP',balance:6400}];
let invoices=[{id:'INV-2026-0108',customer:'Aarav Sen',date:'16 Oct 2026',amount:780,status:'Paid',method:'UPI'},{id:'INV-2026-0107',customer:'Eastern Office Supplies',date:'15 Oct 2026',amount:8500,status:'Overdue',method:'Credit'},{id:'INV-2026-0106',customer:'Mira Das',date:'14 Oct 2026',amount:1250,status:'Partial',method:'Cash'}];
let purchases=[{id:'PO-2026-0041',supplier:'Kolkata Stationers Pvt Ltd',date:'15 Oct 2026',amount:14500,status:'Received'},{id:'PO-2026-0040',supplier:'Metro Lifestyle Distributors',date:'13 Oct 2026',amount:9200,status:'Pending'}];
let expenses=[{id:'EXP-0061',category:'Store utilities',date:'14 Oct 2026',amount:3200,status:'Approved'},{id:'EXP-0060',category:'Packaging',date:'12 Oct 2026',amount:850,status:'Pending'}];
let cart=[], salesCount=1284, salesTotal=284560, nextProductId=7, nextCustomerId=4;
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function load(){try{let x=JSON.parse(localStorage.getItem('dreampos-data'));if(x){products=x.products||products;customers=x.customers||customers;suppliers=x.suppliers||suppliers;invoices=x.invoices||invoices;purchases=x.purchases||purchases;expenses=x.expenses||expenses;salesCount=x.salesCount||salesCount;salesTotal=x.salesTotal||salesTotal;nextProductId=x.nextProductId||nextProductId;nextCustomerId=x.nextCustomerId||nextCustomerId}}catch(e){}}
function persist(){localStorage.setItem('dreampos-data',JSON.stringify({products,customers,suppliers,invoices,purchases,expenses,salesCount,salesTotal,nextProductId,nextCustomerId}));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('overlay').classList.toggle('show',open)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function navRender(){let el=document.getElementById('nav');el.innerHTML=groups.map(([g,items])=>`<div class="nav-label">${g}</div>`+items.map(([n,i])=>`<button class="${current===n?'active':''}" onclick="navigate('${n.replace(/'/g,"\\'")}')"><span class="ico">${i}</span>${n}</button>`).join('')).join('')}
function navigate(n){current=n;navRender();render();toggleSidebar(false)}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">DREAM POS / ${esc(current.toUpperCase())}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function btn(label,fn,primary=false,small=false){return `<button class="btn ${primary?'primary':''} ${small?'small':''}" onclick="${fn}">${label}</button>`}
function kpi(title,val,icon,trend){return `<div class="card kpi"><div class="kpi-top"><span>${title}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value">${val}</div><div class="trend">${trend}</div></div>`}
function status(s){let c=['Paid','Active','Received','Approved','Completed'].includes(s)?'':(['Pending','Partial','Low Stock','Draft','In Transit'].includes(s)?'warn':(['Overdue','Out of Stock','Cancelled','Failed'].includes(s)?'bad':'info'));return `<span class="status ${c}">${esc(s)}</span>`}
function tableCard(title,tools,heads,rows,empty='No records found'){return `<div class="card table-card"><div class="table-tools"><h3>${title}</h3><div class="tool-right">${tools||''}</div></div><div class="table-scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead>${rows ? (rows.trim().startsWith('<tbody') ? rows : `<tbody>${rows}</tbody>`) : `<tbody><tr><td colspan="${heads.length}" class="empty">${empty}</td></tr></tbody>`}</table></div><div class="pagination"><span>Showing ${rows?rows.split('<tr>').length-1:0} records · Local demo data</span><span>Rows per page <select class="pill"><option>10</option><option>25</option><option>50</option></select>　‹　<span class="pill">1</span>　›</span></div></div>`}
function dashboard(){let bars=[42,62,49,75,58,87,67,92,70,80,60,96];return pageHead('Retail overview','Here is what is happening across your business today.',btn('+ New Sale',"navigate('POS Billing')",true)+btn('Export report',"exportDashboard()"))+`<div class="grid kpis">${kpi("Today's Sales",fmt(28460),'↗','↑ 12.8% vs previous day')}${kpi('Transactions','128','▣','↑ 8.2% vs previous day')}${kpi('Inventory Value',fmt(products.reduce((s,p)=>s+p.cost*p.stock,0)),'▤','Across active stock')}${kpi('Low Stock Items',products.filter(p=>p.stock>0&&p.stock<15).length,'⚠','Requires replenishment')}</div><div class="grid dashboard-grid"><div class="card panel"><div class="panel-head"><div><h3>Sales performance</h3><p>Revenue trend · last 12 periods</p></div><span class="pill">This year</span></div><div class="chart">${bars.map((h,i)=>`<div class="barwrap"><div class="bar" style="height:${h}%"></div><span class="barlabel">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]}</span></div>`).join('')}</div><div class="legend"><span>Revenue overview</span><strong>${fmt(salesTotal)} <span class="trend">+12.8%</span></strong></div></div><div class="card panel"><div class="panel-head"><div><h3>Recent activity</h3><p>Latest business events</p></div><button class="linkbtn" onclick="navigate('Invoices')">View all</button></div><div class="activity"><div class="activity-row"><div class="activity-icon">▣</div><div class="activity-info"><strong>Sale completed · INV-2026-0108</strong><small>Aarav Sen · Today, 11:42 AM</small></div><div class="activity-amount">${fmt(780)}</div></div><div class="activity-row"><div class="activity-icon">⇩</div><div class="activity-info"><strong>Purchase received</strong><small>Kolkata Stationers · Yesterday</small></div><div class="activity-amount">${fmt(14500)}</div></div><div class="activity-row"><div class="activity-icon">⚠</div><div class="activity-info"><strong>Stock running low</strong><small>Water Bottle 1L · 8 units left</small></div>${status('Low Stock')}</div><div class="activity-row"><div class="activity-icon">＄</div><div class="activity-info"><strong>Expense awaiting approval</strong><small>Packaging · 12 Oct 2026</small></div>${status('Pending')}</div></div></div></div><div class="grid dashboard-grid"><div>${tableCard('Low stock alerts',btn('View inventory',"navigate('Inventory Management')"),['Product','SKU','Available','Reorder level','Action'],products.filter(p=>p.stock<15).map(p=>`<tr><td><strong>${p.image} ${esc(p.name)}</strong></td><td>${esc(p.sku)}</td><td>${status(p.stock===0?'Out of Stock':'Low Stock')} ${p.stock}</td><td>15</td><td><button class="linkbtn" onclick="openPurchaseFor(${p.id})">Restock</button></td></tr>`).join(''))}</div><div class="card panel"><div class="panel-head"><div><h3>Quick actions</h3><p>Common retail operations</p></div></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">${[['▣','New sale','POS Billing'],['□','Add product','Products'],['⇩','Purchase order','Purchase Management'],['▧','Create invoice','Invoices'],['♙','Add customer','Customers'],['▥','View reports','Reports & Analytics']].map(([i,l,n])=>`<button class="btn" style="text-align:left;padding:14px 11px" onclick="${n==='Products'?"openProductForm()":n==='Customers'?"openCustomerForm()":`navigate('${n}')`}"><span style="color:var(--orange2);font-size:18px;margin-right:7px">${i}</span>${l}</button>`).join('')}</div></div></div>`}
function productRows(list=products){return list.map(p=>`<tr><td><input type="checkbox"></td><td><strong>${p.image||'📦'} ${esc(p.name)}</strong><div style="font-size:10px;color:#9aa1ab;margin-top:4px">${esc(p.category)}</div></td><td>${esc(p.sku)}</td><td>${esc(p.barcode)}</td><td>${fmt(p.price)}</td><td>${fmt(p.cost)}</td><td>${p.stock}</td><td>${status(p.stock===0?'Out of Stock':p.stock<15?'Low Stock':p.status)}</td><td><div class="row-actions"><button class="linkbtn" onclick="viewProduct(${p.id})">View</button><button class="linkbtn" onclick="openProductForm(${p.id})">Edit</button></div></td></tr>`).join('')}
function productsPage(){return pageHead('Products','Manage catalog, pricing, images, SKUs and barcodes.',btn('Import CSV',"importCSV('products')")+btn('Export CSV',"exportCSV('products')")+btn('+ Add Product',"openProductForm()",true))+tableCard('Product catalog',`<input class="search" placeholder="Search products…" oninput="filterTable(this, 'productsTable')">`,['','Product','SKU','Barcode','Selling price','Cost','Stock','Status','Actions'],`<tbody id="productsTable">${productRows()}</tbody>`)}
function customersPage(){let rows=customers.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.type)}</td><td>${c.points}</td><td>${fmt(c.balance)}</td><td><button class="linkbtn" onclick="viewCustomer(${c.id})">View</button> <button class="linkbtn" onclick="openCustomerForm(${c.id})">Edit</button></td></tr>`).join('');return pageHead('Customers','Customer profiles, purchase history, loyalty and balances.',btn('Export CSV',"exportCSV('customers')")+btn('+ Add Customer',"openCustomerForm()",true))+tableCard('Customer directory',`<input class="search" placeholder="Search customers…" oninput="filterTable(this)">`,['Customer','Phone','Email','Type','Points','Balance','Actions'],rows)}
function suppliersPage(){let rows=suppliers.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td>${esc(s.gstin)}</td><td>${fmt(s.balance)}</td><td>${status('Active')}</td><td><button class="linkbtn" onclick="viewSupplier(${s.id})">View</button></td></tr>`).join('');return pageHead('Suppliers','Supplier directory, GST details and outstanding payables.',btn('Export CSV',"exportCSV('suppliers')")+btn('+ Add Supplier',"openSupplierForm()",true))+tableCard('Supplier directory','',['Supplier','Phone','Email','GSTIN','Payable balance','Status','Actions'],rows)}
function invoicesPage(){let rows=invoices.map(i=>`<tr><td><strong>${esc(i.id)}</strong></td><td>${esc(i.customer)}</td><td>${esc(i.date)}</td><td><strong>${fmt(i.amount)}</strong></td><td>${status(i.status)}</td><td>${esc(i.method)}</td><td><div class="row-actions"><button class="linkbtn" onclick="previewInvoice('${i.id}')">Preview</button><button class="linkbtn" onclick="shareInvoice('${i.id}')">Share</button></div></td></tr>`).join('');return pageHead('Invoices','Preview, edit eligible drafts, print and share customer invoices.',btn('Export CSV',"exportCSV('invoices')")+btn('+ New Invoice',"openInvoiceForm()",true))+tableCard('Invoice register',`<input class="search" placeholder="Search invoices…" oninput="filterTable(this)">`,['Invoice no.','Customer','Date','Amount','Status','Payment','Actions'],rows)}
function purchasePage(){let rows=purchases.map(p=>`<tr><td><strong>${esc(p.id)}</strong></td><td>${esc(p.supplier)}</td><td>${esc(p.date)}</td><td>${fmt(p.amount)}</td><td>${status(p.status)}</td><td><button class="linkbtn" onclick="previewPurchase('${p.id}')">Preview</button></td></tr>`).join('');return pageHead('Purchase management','Purchase orders, goods receipts and supplier commitments.',btn('Export CSV',"exportCSV('purchases')")+btn('+ New Purchase',"openPurchaseForm()",true))+tableCard('Purchase orders','',['PO number','Supplier','Date','Amount','Status','Actions'],rows)}
function inventoryPage(){return pageHead('Inventory management','Stock availability, valuation, reorder points and movement visibility.',btn('Export CSV',"exportCSV('products')")+btn('Stock adjustment',"openStockAdjust()",true))+`<div class="grid kpis">${kpi('Total SKUs',products.length,'□','Active catalog')}${kpi('Units on hand',products.reduce((s,p)=>s+p.stock,0),'▤','Across demo store')}${kpi('Stock value',fmt(products.reduce((s,p)=>s+p.cost*p.stock,0)),'＄','At purchase cost')}${kpi('Reorder alerts',products.filter(p=>p.stock<15).length,'⚠','Below 15 units')}</div>`+tableCard('Stock on hand',`<input class="search" placeholder="Search stock…" oninput="filterTable(this)">`,['Product','SKU','Category','On hand','Unit cost','Stock value','Status','Actions'],products.map(p=>`<tr><td><strong>${p.image} ${esc(p.name)}</strong></td><td>${esc(p.sku)}</td><td>${esc(p.category)}</td><td>${p.stock}</td><td>${fmt(p.cost)}</td><td>${fmt(p.cost*p.stock)}</td><td>${status(p.stock===0?'Out of Stock':p.stock<15?'Low Stock':'In Stock')}</td><td><button class="linkbtn" onclick="openStockAdjust(${p.id})">Adjust</button></td></tr>`).join(''))}
function barcodePage(){return pageHead('Barcode management','Generate labels and scan SKU/barcode values into retail workflows.',btn('Print labels',"printBarcodeLabels()",true))+`<div class="grid dashboard-grid"><div class="card panel"><div class="panel-head"><div><h3>Barcode scanner</h3><p>USB/Bluetooth scanner input or manual entry</p></div></div><div class="field"><label>Scan or enter barcode</label><input id="scanInput" placeholder="8901000000012" onkeydown="if(event.key==='Enter')lookupBarcode()"></div><div style="margin-top:12px">${btn('Find product',"lookupBarcode()",true)}</div><div id="scanResult" style="margin-top:15px"></div><div class="notice" style="margin-top:18px">Camera scanning depends on browser support and HTTPS permissions. This starter supports keyboard-wedge scanners and manual barcode lookup.</div></div><div class="card panel"><h3 style="margin-top:0">Barcode label settings</h3><div class="field" style="margin:14px 0"><label>Label format</label><select id="labelFormat"><option>Code 128</option><option>EAN-13</option><option>UPC-A</option><option>QR Code</option></select></div><div class="field"><label>Product</label><select id="labelProduct">${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:14px"><label>Number of labels</label><input id="labelQty" type="number" min="1" max="500" value="1"></div><div style="margin-top:14px">${btn('Preview & print',"printBarcodeLabels()",true)}</div></div></div>`}
function posPage(){return pageHead('POS Billing & Checkout','Scan items, manage cart and complete a demo checkout.',btn('Clear cart',"clearCart()")+btn('New customer',"openCustomerForm()",true))+`<div class="split"><div class="card panel"><div class="panel-head"><div><h3>Find products</h3><p>Click a product or scan its barcode</p></div></div><div class="field" style="margin-bottom:14px"><label>Search / barcode scanner</label><input id="posSearch" placeholder="Product name, SKU or barcode…" oninput="renderPosProducts()" onkeydown="if(event.key==='Enter'){let v=this.value.trim();let p=products.find(x=>x.barcode===v||x.sku.toLowerCase()===v.toLowerCase());if(p)addToCart(p.id)}"></div><div class="pos-products" id="posProducts">${posProductTiles()}</div></div><div class="card panel"><div class="panel-head"><div><h3>Current sale</h3><p>Register · Main Store</p></div><span class="pill">${cart.reduce((s,c)=>s+c.qty,0)} items</span></div><div id="cartLines">${cartLines()}</div><div class="field" style="margin-top:12px"><label>Customer</label><select id="posCustomer">${'<option value="">Walk-in customer</option>'+customers.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Payment method</label><select id="posMethod"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Credit (authorized)</option></select></div><div style="margin-top:15px" id="cartTotals">${cartTotals()}</div><button class="btn primary" style="width:100%;margin-top:14px;padding:13px" onclick="checkout()">Complete Sale · ${fmt(cart.reduce((s,c)=>s+c.price*c.qty,0))}</button><div class="sub" style="font-size:10px;margin-top:9px">Demo checkout stores locally in this browser. Configure a backend and payment provider before live use.</div></div></div>`}
function posProductTiles(){return products.filter(p=>p.stock>0).map(p=>`<button class="product-tile" onclick="addToCart(${p.id})"><div class="product-img">${p.image||'📦'}</div><strong>${esc(p.name)}</strong><small>${fmt(p.price)} · ${p.stock} in stock</small></button>`).join('')}
function renderPosProducts(){let q=(document.getElementById('posSearch')?.value||'').toLowerCase();document.getElementById('posProducts').innerHTML=products.filter(p=>p.stock>0&&[p.name,p.sku,p.barcode,p.category].some(v=>v.toLowerCase().includes(q))).map(p=>`<button class="product-tile" onclick="addToCart(${p.id})"><div class="product-img">${p.image||'📦'}</div><strong>${esc(p.name)}</strong><small>${fmt(p.price)} · ${p.stock} in stock</small></button>`).join('')||'<div class="empty">No products match.</div>'}
function cartLines(){return cart.length?cart.map(c=>`<div class="cart-line"><div class="cart-name"><strong>${esc(c.name)}</strong><small>${fmt(c.price)} each</small></div><div class="qty"><button onclick="changeQty(${c.id},-1)">−</button><span>${c.qty}</span><button onclick="changeQty(${c.id},1)">+</button></div><strong>${fmt(c.price*c.qty)}</strong><button class="linkbtn" onclick="removeCart(${c.id})">×</button></div>`).join(''):'<div class="empty">Your cart is empty. Scan or select a product to begin.</div>'}
function cartTotals(){let sub=cart.reduce((s,c)=>s+c.price*c.qty,0),tax=Math.round(sub*.05*100)/100;return `<div class="totalrow"><span>Subtotal</span><strong>${fmt(sub)}</strong></div><div class="totalrow"><span>Estimated tax (5% demo)</span><strong>${fmt(tax)}</strong></div><div class="totalrow grand"><span>Total</span><strong>${fmt(sub+tax)}</strong></div>`}
function refreshCart(){let lines=document.getElementById('cartLines');if(lines)lines.innerHTML=cartLines();let totals=document.getElementById('cartTotals');if(totals)totals.innerHTML=cartTotals();let button=document.querySelector('.split .btn.primary');if(button)button.textContent='Complete Sale · '+fmt(cart.reduce((s,c)=>s+c.price*c.qty,0));let p=document.querySelector('.split .panel .pill');if(p)p.textContent=cart.reduce((s,c)=>s+c.qty,0)+' items'}
function addToCart(id){let p=products.find(x=>x.id===id);if(!p||p.stock<1)return toast('No stock available');let c=cart.find(x=>x.id===id);if(c){if(c.qty>=p.stock)return toast('Cannot exceed available stock');c.qty++}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});refreshCart();toast(p.name+' added to cart')}
function changeQty(id,d){let c=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!c)return;if(c.qty+d<1){removeCart(id);return}if(c.qty+d>p.stock)return toast('Cannot exceed available stock');c.qty+=d;refreshCart()}
function removeCart(id){cart=cart.filter(c=>c.id!==id);refreshCart()}
function clearCart(){cart=[];refreshCart();toast('Cart cleared')}
function checkout(){if(!cart.length)return toast('Add at least one product');let customer=document.getElementById('posCustomer')?.value||'Walk-in customer',method=document.getElementById('posMethod')?.value||'Cash';for(let c of cart){let p=products.find(x=>x.id===c.id);if(!p||p.stock<c.qty)return toast('Stock changed. Review cart.')}let sub=cart.reduce((s,c)=>s+c.price*c.qty,0),total=Math.round(sub*1.05*100)/100;cart.forEach(c=>{products.find(p=>p.id===c.id).stock-=c.qty});salesCount++;salesTotal+=total;let id='INV-2026-'+String(109+invoices.length).padStart(4,'0');let inv={id,customer,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),amount:total,status:method==='Credit'?'Unpaid':'Paid',method,items:cart.map(c=>({...c})),subtotal:sub,tax:total-sub};invoices.unshift(inv);persist();cart=[];openInvoicePreview(inv);toast('Demo sale saved locally')}
function openInvoicePreview(inv){openModal('Sale complete · '+inv.id,invoiceHTML(inv),`<button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="printInvoice('${inv.id}')">Print</button><button class="btn" onclick="downloadInvoice('${inv.id}')">Download HTML</button><button class="btn primary" onclick="shareInvoice('${inv.id}')">Share</button>`)}
function invoiceHTML(inv){let items=inv.items||[{name:'Retail purchase',qty:1,price:inv.amount/1.05}];return `<div id="invoiceDoc" style="color:#263247"><div style="display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #ff9f3f;padding-bottom:16px"><div><div style="font-size:24px;font-weight:800">Dreams <span style="color:#ff9f3f">POS</span></div><div style="font-size:12px;color:#6b7280;margin-top:6px">Demo Retail Store · Kolkata, West Bengal<br>GSTIN: Configure in Settings</div></div><div style="text-align:right"><h2 style="margin:0 0 8px">TAX INVOICE / RECEIPT</h2><strong>${esc(inv.id)}</strong><div style="font-size:12px;margin-top:6px">${esc(inv.date)}</div></div></div><div style="padding:18px 0;font-size:13px"><strong>Bill to:</strong> ${esc(inv.customer)}<br><strong>Payment:</strong> ${esc(inv.method)} · ${esc(inv.status)}</div><table style="white-space:normal"><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${fmt(i.price)}</td><td>${fmt(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div style="max-width:280px;margin:18px 0 18px auto">${inv.subtotal!=null?`<div class="totalrow"><span>Subtotal</span><strong>${fmt(inv.subtotal)}</strong></div><div class="totalrow"><span>Estimated tax</span><strong>${fmt(inv.tax||0)}</strong></div>`:''}<div class="totalrow grand"><span>Total</span><strong>${fmt(inv.amount)}</strong></div></div><div style="text-align:center;border-top:1px solid #e2e7ec;padding-top:15px;color:#6b7280;font-size:12px">Thank you for shopping with us. This is a demo document template.</div></div>`}
function invoiceById(id){return invoices.find(i=>i.id===id)}
function previewInvoice(id){let inv=invoiceById(id);if(!inv)return;openModal('Document preview · '+id,invoiceHTML(inv),`<button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="printInvoice('${id}')">Print / Save PDF</button><button class="btn" onclick="downloadInvoice('${id}')">Download HTML</button><button class="btn primary" onclick="shareInvoice('${id}')">Share</button>`)}
function printInvoice(id){let inv=invoiceById(id);if(!inv)return;let w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');w.document.write(`<html><head><title>${esc(id)}</title><style>body{font:13px Arial;padding:28px;color:#202b45}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd}th{background:#fafafa}.totalrow{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:18px;font-weight:bold;border-top:1px solid #ddd;padding-top:12px}@page{margin:12mm}</style></head><body>${invoiceHTML(inv)}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function downloadInvoice(id){let inv=invoiceById(id);if(!inv)return;let blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"><title>${esc(id)}</title></head><body>${invoiceHTML(inv)}</body></html>`],{type:'text/html'});downloadBlob(blob,id+'.html');toast('Invoice file downloaded. Use Print → Save as PDF for PDF output.')}
function shareInvoice(id){let inv=invoiceById(id);if(!inv)return;openModal('Share document · '+id,`<div class="notice">Choose a channel. This demo opens the available share composer; actual delivery requires configured WhatsApp Business, SMS and email providers.</div><div class="form-grid" style="margin-top:16px"><div class="field"><label>Recipient phone</label><input id="sharePhone" placeholder="+91 98765 43210"></div><div class="field"><label>Recipient email</label><input id="shareEmail" placeholder="customer@example.com"></div><div class="field full"><label>Message</label><textarea id="shareMessage">Hello ${esc(inv.customer)}, invoice ${esc(inv.id)} total ${fmt(inv.amount)} from Dream POS is ready.</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="shareWhatsApp('${id}')">WhatsApp</button><button class="btn" onclick="shareSMS('${id}')">SMS</button><button class="btn primary" onclick="shareEmail('${id}')">Email</button>`)}
function shareWhatsApp(id){let phone=document.getElementById('sharePhone')?.value||'',msg=document.getElementById('shareMessage')?.value||('Invoice '+id);let url='https://wa.me/'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);window.open(url,'_blank');toast('WhatsApp composer opened; message not sent by this demo')}
function shareSMS(id){let phone=document.getElementById('sharePhone')?.value||'',msg=document.getElementById('shareMessage')?.value||('Invoice '+id);window.location.href='sms:'+phone+'?&body='+encodeURIComponent(msg);toast('SMS app requested; delivery is not verified')}
function shareEmail(id){let email=document.getElementById('shareEmail')?.value||'',msg=document.getElementById('shareMessage')?.value||('Invoice '+id);window.location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Invoice '+id)+'&body='+encodeURIComponent(msg);toast('Email composer opened; email not sent by this demo')}
function render(){let c=document.getElementById('content');let map={'Dashboard':dashboard,'Products':productsPage,'Customers':customersPage,'Suppliers':suppliersPage,'Invoices':invoicesPage,'Purchase Management':purchasePage,'Inventory Management':inventoryPage,'Stock Management':inventoryPage,'POS Billing':posPage,'Barcode Management':barcodePage};if(map[current])c.innerHTML=map[current]();else c.innerHTML=genericPage(current);if(current==='POS Billing')refreshCart()}
function genericPage(n){let desc={
'Sales Management':'Sales orders, transaction history and fulfilment status.','Quotations':'Prepare customer quotations, preview documents and convert accepted quotes.','Returns & Exchanges':'Review returns, exchanges, refund requests and stock disposition.','Categories':'Organize the product catalog into categories and subcategories.','Warehouse Management':'Manage warehouse locations, inbound/outbound operations and stock transfers.','Customer Loyalty':'Track loyalty balances, rewards, tiers and redemption activity.','Expense Management':'Record business expenses, attach receipts and manage approvals.','Accounting & Finance':'Financial ledgers, reconciliation, journal entries and statements.','HRM & Payroll':'Employees, attendance, leave, payroll and payslips.','Reports & Analytics':'Business performance reports with date and store filters.','Chat Application':'Team conversations and operational communication.','Email Application':'Internal notifications and configured transactional email history.','Calendar':'Team calendar, meetings, shifts and reminders.','Notes':'Personal and shared operational notes.','To Do':'Assigned tasks, priorities and due dates.','Projects':'Projects, milestones, tasks and progress tracking.','File Manager':'Secure file storage, search and document organization.','Audio & Video Calls':'Meeting rooms and call integrations.','SaaS Super Admin':'Platform-level tenant, subscription, usage and support administration.','User & Role Management':'Role-based access control and store/warehouse scope assignments.','Document Center':'Centralized document preview, print, download and sharing history.','Settings':'Organization profile, tax, registers, integrations and document preferences.'}[n]||'Manage records and workflows for this module.';let cards={'Categories':[['Stationery','42 products'],['Office','18 products'],['Electronics','25 products'],['Lifestyle','13 products']], 'Warehouse Management':[['Main Warehouse','1,240 units'],['Store Backroom','328 units'],['Salt Lake Branch','184 units']], 'Reports & Analytics':[['Sales Reports','Revenue and transaction trends'],['Inventory Reports','Stock valuation and movement'],['Tax Reports','Tax summaries and breakdown'],['Store Performance','Branch comparisons']], 'SaaS Super Admin':[['Organizations','12 tenants · demo'],['Subscriptions','9 active · demo'],['Platform usage','72% demo capacity'],['System status','Demo environment']], 'Document Center':[['Invoices','Preview, print, export and share'],['Quotations','Preview and revise drafts'],['Purchase orders','Print and export'],['Financial reports','PDF and spreadsheet exports']]};let items=cards[n]||[['Overview','Module summary'],['Recent records','Records and activity'],['Approvals','Pending review'],['Settings','Configure module']];return pageHead(n,desc,btn('Export CSV',"exportCSV('"+(n==='Customers'?'customers':n==='Suppliers'?'suppliers':n==='Invoices'?'invoices':'products')+"')")+btn('+ Create new',"genericCreate('"+n.replace(/'/g,"\\'")+"')",true))+`<div class="grid kpis">${kpi('Records',n==='Categories'?'4':n==='Document Center'?invoices.length:12,'▤','Current demo workspace')}${kpi('Pending actions','3','◷','Review required')}${kpi('Updated today','8','↻','Across this module')}${kpi('Status','Operational','✓','Local demo mode')}</div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px">${items.map(([a,b])=>`<div class="card panel"><div class="panel-head"><div><h3>${esc(a)}</h3><p>${esc(b)}</p></div><span class="kpi-icon">↗</span></div><button class="btn small" onclick="genericCreate('${n.replace(/'/g,"\\'")}')">Open / Manage</button></div>`).join('')}</div><div class="notice">This module is represented in the starter navigation and dashboard shell. The full production workflow requires its dedicated data model, APIs, permission rules, and integration tests. Current sample records are stored locally in this browser.</div>`}
function openModal(title,body,foot=''){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot||`<button class="btn" onclick="closeModal()">Cancel</button>`;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');modalSave=null}
function productForm(p){return `<form id="productForm" class="form-grid" onsubmit="saveProduct(event,${p?.id||0})"><div class="field"><label>Product name *</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="field"><label>SKU *</label><input name="sku" required value="${esc(p?.sku||'')}"></div><div class="field"><label>Barcode</label><input name="barcode" value="${esc(p?.barcode||'')}"></div><div class="field"><label>Category</label><select name="category"><option ${p?.category==='Stationery'?'selected':''}>Stationery</option><option ${p?.category==='Office'?'selected':''}>Office</option><option ${p?.category==='Electronics'?'selected':''}>Electronics</option><option ${p?.category==='Lifestyle'?'selected':''}>Lifestyle</option></select></div><div class="field"><label>Selling price (₹) *</label><input name="price" type="number" min="0" step=".01" required value="${p?.price??''}"></div><div class="field"><label>Purchase cost (₹)</label><input name="cost" type="number" min="0" step=".01" value="${p?.cost??''}"></div><div class="field"><label>Opening / current stock</label><input name="stock" type="number" min="0" step="1" value="${p?.stock??0}"></div><div class="field"><label>Product icon</label><input name="image" maxlength="8" value="${esc(p?.image||'📦')}" placeholder="📦"></div><div class="field full"><label>Product image upload</label><input name="imageFile" type="file" accept="image/*" onchange="previewUpload(this,'uploadPreview')"><div id="uploadPreview" class="sub">Optional. Local demo stores an icon; production image storage needs object storage.</div></div></form>`}
function openProductForm(id){let p=products.find(x=>x.id===id);openModal(p?'Edit product':'Add product',productForm(p),`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('productForm').requestSubmit()">Save product</button>`)}
function previewUpload(input,target){let f=input.files?.[0];if(!f)return;if(f.size>5*1024*1024){input.value='';return toast('Image must be under 5 MB')}document.getElementById(target).textContent='Selected: '+f.name+' · '+Math.round(f.size/1024)+' KB'}
function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),sku:f.get('sku').trim(),barcode:f.get('barcode').trim(),category:f.get('category'),price:+f.get('price'),cost:+f.get('cost')||0,stock:+f.get('stock')||0,image:f.get('image')||'📦',status:'Active'};if(products.some(p=>p.sku.toLowerCase()===data.sku.toLowerCase()&&p.id!==id))return toast('SKU already exists');if(data.barcode&&products.some(p=>p.barcode===data.barcode&&p.id!==id))return toast('Barcode already exists');if(id){products=products.map(p=>p.id===id?{...p,...data}:p)}else{data.id=nextProductId++;products.unshift(data)}persist();closeModal();render();toast('Product saved')}
function viewProduct(id){let p=products.find(x=>x.id===id);if(!p)return;openModal('Product details',`<div style="display:flex;gap:16px;align-items:center"><div class="product-img" style="width:90px;height:90px">${p.image}</div><div><h2 style="margin:0 0 8px">${esc(p.name)}</h2><div class="sub">${esc(p.sku)} · ${esc(p.barcode)}</div><h3>${fmt(p.price)}</h3></div></div><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><div class="form-grid"><div><small>Category</small><p>${esc(p.category)}</p></div><div><small>Stock</small><p>${p.stock} units</p></div><div><small>Purchase cost</small><p>${fmt(p.cost)}</p></div><div><small>Status</small><p>${status(p.stock===0?'Out of Stock':p.stock<15?'Low Stock':p.status)}</p></div></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openProductForm(${id})">Edit product</button>`)}
function openCustomerForm(id){let c=customers.find(x=>x.id===id);openModal(c?'Edit customer':'Add customer',`<form id="customerForm" class="form-grid" onsubmit="saveCustomer(event,${id||0})"><div class="field"><label>Name *</label><input name="name" required value="${esc(c?.name||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c?.phone||'')}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c?.email||'')}"></div><div class="field"><label>Customer type</label><select name="type"><option ${c?.type==='Retail'?'selected':''}>Retail</option><option ${c?.type==='Business'?'selected':''}>Business</option><option ${c?.type==='Wholesale'?'selected':''}>Wholesale</option></select></div><div class="field"><label>Loyalty points</label><input name="points" type="number" value="${c?.points||0}"></div><div class="field"><label>Opening balance (₹)</label><input name="balance" type="number" value="${c?.balance||0}"></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('customerForm').requestSubmit()">Save customer</button>`)}
function saveCustomer(e,id){e.preventDefault();let f=new FormData(e.target),d={name:f.get('name').trim(),phone:f.get('phone'),email:f.get('email'),type:f.get('type'),points:+f.get('points')||0,balance:+f.get('balance')||0};if(id)customers=customers.map(c=>c.id===id?{...c,...d}:c);else customers.unshift({id:nextCustomerId++,...d});persist();closeModal();render();toast('Customer saved')}
function viewCustomer(id){let c=customers.find(x=>x.id===id);openModal('Customer profile',`<h2>${esc(c.name)}</h2><p>${esc(c.phone)} · ${esc(c.email)}</p><div class="grid kpis" style="grid-template-columns:repeat(2,1fr)">${kpi('Loyalty points',c.points,'☆','Current balance')}${kpi('Account balance',fmt(c.balance),'＄','Outstanding balance')}</div><h3>Recent invoices</h3>${invoices.filter(i=>i.customer===c.name).map(i=>`<p>${esc(i.id)} · ${fmt(i.amount)} · ${status(i.status)}</p>`).join('')||'<p class="sub">No linked invoices in the demo.</p>'}`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openCustomerForm(${id})">Edit</button>`)}
function openSupplierForm(){openModal('Add supplier',`<form id="supplierForm" class="form-grid" onsubmit="saveSupplier(event)"><div class="field"><label>Supplier name *</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>GSTIN</label><input name="gstin" maxlength="15"></div><div class="field"><label>Opening payable (₹)</label><input name="balance" type="number" min="0" value="0"></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('supplierForm').requestSubmit()">Save supplier</button>`)}
function saveSupplier(e){e.preventDefault();let f=new FormData(e.target);suppliers.unshift({id:Math.max(0,...suppliers.map(s=>s.id))+1,name:f.get('name'),phone:f.get('phone'),email:f.get('email'),gstin:f.get('gstin'),balance:+f.get('balance')||0});persist();closeModal();render();toast('Supplier saved')}
function viewSupplier(id){let s=suppliers.find(x=>x.id===id);openModal('Supplier profile',`<h2>${esc(s.name)}</h2><p>${esc(s.phone)} · ${esc(s.email)}</p><p>GSTIN: ${esc(s.gstin)}</p><h3>Outstanding payable: ${fmt(s.balance)}</h3><h3>Purchase history</h3>${purchases.filter(p=>p.supplier===s.name).map(p=>`<p>${esc(p.id)} · ${fmt(p.amount)} · ${status(p.status)}</p>`).join('')||'<p>No purchase records linked.</p>'}`)}
function openPurchaseForm(){openModal('New purchase order',`<form id="purchaseForm" class="form-grid" onsubmit="savePurchase(event)"><div class="field"><label>Supplier *</label><select name="supplier" required>${suppliers.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Purchase amount (₹) *</label><input name="amount" type="number" min="0.01" step=".01" required></div><div class="field"><label>Status</label><select name="status"><option>Pending</option><option>Approved</option><option>Received</option></select></div><div class="field"><label>Expected date</label><input name="date" type="date"></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('purchaseForm').requestSubmit()">Save purchase</button>`)}
function savePurchase(e){e.preventDefault();let f=new FormData(e.target),id='PO-2026-'+String(42+purchases.length).padStart(4,'0');purchases.unshift({id,supplier:f.get('supplier'),date:f.get('date')||new Date().toLocaleDateString('en-GB'),amount:+f.get('amount'),status:f.get('status')});persist();closeModal();render();toast('Purchase order saved')}
function previewPurchase(id){let p=purchases.find(x=>x.id===id);openModal('Purchase order · '+id,`<h2>Dream POS</h2><h3>${esc(p.id)}</h3><p>Supplier: ${esc(p.supplier)}</p><p>Date: ${esc(p.date)}</p><p>Status: ${esc(p.status)}</p><h2>${fmt(p.amount)}</h2><p class="sub">Demo purchase document. Production goods-receipt workflow should post stock once only.</p>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="window.print()">Print / PDF</button>`)}
function openStockAdjust(id){let p=products.find(x=>x.id===id);openModal('Stock adjustment',`<form id="stockForm" class="form-grid" onsubmit="saveStockAdjust(event)"><div class="field full"><label>Product</label><select name="id">${products.map(x=>`<option value="${x.id}" ${p?.id===x.id?'selected':''}>${esc(x.name)} · on hand ${x.stock}</option>`).join('')}</select></div><div class="field"><label>Adjustment</label><select name="type"><option value="add">Add stock</option><option value="remove">Remove stock</option><option value="set">Set exact quantity</option></select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="0" required></div><div class="field full"><label>Reason *</label><input name="reason" required placeholder="Stock count correction, damage…"></div></form><div class="notice" style="margin-top:14px">Demo mode records the updated quantity locally. Production must persist an immutable stock movement ledger.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('stockForm').requestSubmit()">Apply adjustment</button>`)}
function saveStockAdjust(e){e.preventDefault();let f=new FormData(e.target),p=products.find(x=>x.id===+f.get('id')),q=+f.get('qty');if(f.get('type')==='add')p.stock+=q;else if(f.get('type')==='remove'){if(q>p.stock)return toast('Cannot remove more than available');p.stock-=q}else p.stock=q;p.status=p.stock===0?'Out of Stock':p.stock<15?'Low Stock':'Active';persist();closeModal();render();toast('Stock quantity adjusted')}
function openInvoiceForm(){openModal('Create invoice',`<form id="invoiceForm" class="form-grid" onsubmit="saveInvoice(event)"><div class="field"><label>Customer *</label><select name="customer">${customers.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Amount (₹) *</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Payment method</label><select name="method"><option>UPI</option><option>Cash</option><option>Card</option><option>Credit</option></select></div><div class="field"><label>Status</label><select name="status"><option>Draft</option><option>Paid</option><option>Unpaid</option></select></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('invoiceForm').requestSubmit()">Save draft</button>`)}
function saveInvoice(e){e.preventDefault();let f=new FormData(e.target),id='INV-2026-'+String(109+invoices.length).padStart(4,'0'),inv={id,customer:f.get('customer'),date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),amount:+f.get('amount'),status:f.get('status'),method:f.get('method')};invoices.unshift(inv);persist();closeModal();render();toast('Invoice draft saved');}
function lookupBarcode(){let v=document.getElementById('scanInput').value.trim(),p=products.find(x=>x.barcode===v||x.sku.toLowerCase()===v.toLowerCase());document.getElementById('scanResult').innerHTML=p?`<div class="card panel"><div style="font-size:30px">${p.image}</div><h3>${esc(p.name)}</h3><p>SKU: ${esc(p.sku)} · Barcode: ${esc(p.barcode)}</p><p>Price: <strong>${fmt(p.price)}</strong> · Stock: ${p.stock}</p><button class="btn primary" onclick="navigate('POS Billing');setTimeout(()=>addToCart(${p.id}),50)">Add to POS</button></div>`:'<div class="notice">No product found for this barcode. Check the value or add a product barcode.</div>'}
function printBarcodeLabels(){let id=+(document.getElementById('labelProduct')?.value||products[0].id),p=products.find(x=>x.id===id),qty=Math.max(1,Math.min(500,+(document.getElementById('labelQty')?.value||1))),format=document.getElementById('labelFormat')?.value||'Code 128';if(!p)return;let w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print labels');w.document.write(`<html><head><title>Barcode labels</title><style>body{font-family:Arial;display:flex;flex-wrap:wrap;gap:8px}.label{width:180px;height:90px;border:1px solid #ddd;padding:8px;text-align:center;page-break-inside:avoid}.bars{font-family:monospace;font-size:19px;letter-spacing:1px;margin:7px 0}</style></head><body>${Array.from({length:qty},()=>`<div class="label"><b>${esc(p.name)}</b><div class="bars">▌▌▌ ▌▌ ▌▌▌▌ ▌▌▌</div>${esc(p.barcode)}<div>${fmt(p.price)} · ${esc(format)}</div></div>`).join('')}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportCSV(kind){let data=kind==='customers'?customers:kind==='suppliers'?suppliers:kind==='invoices'?invoices:kind==='purchases'?purchases:products;if(!data.length)return toast('No records to export');let keys=[...new Set(data.flatMap(o=>Object.keys(o)))],csv=[keys.join(','),...data.map(o=>keys.map(k=>'"'+String(typeof o[k]==='object'?JSON.stringify(o[k]):o[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),kind+'-export.csv');toast('CSV export ready')}
function exportDashboard(){let data=[['Metric','Value'],["Today's Sales",28460],['Transactions',128],['Inventory Value',products.reduce((s,p)=>s+p.cost*p.stock,0)],['Low Stock Items',products.filter(p=>p.stock<15).length]];downloadBlob(new Blob([data.map(r=>r.join(',')).join('\r\n')],{type:'text/csv'}),'dream-pos-dashboard.csv')}
function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function filterTable(input,id){let q=input.value.toLowerCase(),tb=id?document.getElementById(id):input.closest('.card')?.querySelector('tbody');if(!tb)return;[...tb.querySelectorAll('tr')].forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function importCSV(kind){openModal('Import '+kind,`<div class="notice">Select a CSV file to review its rows. This demo provides a product import path; complex imports should use server-side validation and row-level error reports.</div><div class="field" style="margin-top:18px"><label>CSV file</label><input id="csvFile" type="file" accept=".csv,text/csv" onchange="previewCSV(this)"></div><div id="csvPreview" style="margin-top:14px"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyCSVImport('${kind}')">Import valid rows</button>`)}
let importRows=[];
function previewCSV(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{let lines=String(r.result).split(/\r?\n/).filter(Boolean);importRows=lines.slice(1).map(line=>line.split(',').map(v=>v.replace(/^"|"$/g,'')));document.getElementById('csvPreview').innerHTML=`<p>${importRows.length} data rows detected</p><div class="table-scroll"><table><tbody>${lines.slice(0,6).map(l=>`<tr>${l.split(',').map(v=>`<td>${esc(v.replace(/^"|"$/g,''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};r.readAsText(f)}
function applyCSVImport(kind){if(kind!=='products')return toast('CSV import preview available; only product import is wired in this starter');if(!importRows.length)return toast('Choose a CSV file first');let added=0;for(let r of importRows){if(r.length<5||!r[0]||!r[1])continue;let p={id:nextProductId++,name:r[0],sku:r[1],barcode:r[2]||'',category:r[3]||'General',price:+r[4]||0,cost:+r[5]||0,stock:+r[6]||0,status:'Active',image:'📦'};if(products.some(x=>x.sku===p.sku))continue;products.push(p);added++}persist();closeModal();render();toast(added+' products imported')}
function globalSearchGo(){let q=document.getElementById('globalSearch').value.trim().toLowerCase();if(!q)return;let p=products.find(p=>[p.name,p.sku,p.barcode].some(v=>v.toLowerCase().includes(q)));let c=customers.find(c=>[c.name,c.phone,c.email].some(v=>v.toLowerCase().includes(q)));let i=invoices.find(i=>[i.id,i.customer].some(v=>v.toLowerCase().includes(q)));if(p){navigate('Products');setTimeout(()=>openProductForm(p.id),50)}else if(c){navigate('Customers');setTimeout(()=>viewCustomer(c.id),50)}else if(i){navigate('Invoices');setTimeout(()=>previewInvoice(i.id),50)}else toast('No matching product, customer or invoice')}
function genericCreate(n){if(n==='Products')return openProductForm();if(n==='Customers')return openCustomerForm();if(n==='Suppliers')return openSupplierForm();if(n==='Invoices')return openInvoiceForm();if(n==='Purchase Management')return openPurchaseForm();if(n==='Inventory Management'||n==='Stock Management')return openStockAdjust();if(n==='POS Billing')return navigate(n);openModal('Create · '+n,`<div class="notice">This module's navigation and overview are available in the starter. The full create/edit workflow and server-side persistence must be implemented before operational use.</div><p>Selected module: <strong>${esc(n)}</strong></p>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="toast('Add the dedicated module workflow to continue')">Continue</button>`)}
function settingsForm(){return `<div class="form-grid"><div class="field"><label>Business name</label><input value="Demo Retail Store"></div><div class="field"><label>Currency</label><select><option>INR (₹)</option></select></div><div class="field"><label>Timezone</label><select><option>Asia/Kolkata</option></select></div><div class="field"><label>Current role (preview)</label><select onchange="role=this.value;toast('Role preview changed to '+role)"><option>Business Owner</option><option>Store Manager</option><option>Cashier</option><option>Inventory Manager</option><option>Accountant</option><option>HR Manager</option><option>SaaS Super Admin</option></select></div></div><div class="notice" style="margin-top:18px">This starter uses local browser storage and does not provide secure authentication or real tenant isolation. Do not enter real customer or financial data.</div>`}
load();navRender();render();
</script>
</body></html>
